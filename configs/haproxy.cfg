global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

frontend http_front
    bind *:80
    mode http
    default_backend app_servers

    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http

backend app_servers
    mode http
    balance roundrobin
    option httpchk GET /health.php
    http-check expect status 200

    server app-private 10.0.0.17:80 check weight 64 inter 2000 rise 2 fall 3

    server app-aws 100.126.36.10:80 check weight 0 inter 5000 rise 3 fall 5

listen haproxy_exporter
    bind *:9101
    http-request use-service prometheus-exporter if { path /metrics }